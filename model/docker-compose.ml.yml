version: '3.8'

services:
  evsathi-ml-inference:
    build:
      context: ..
      dockerfile: model/Dockerfile
    container_name: evsathi-ml-service
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - MODEL_PATH=/app/model/models/xgboost_demand_v1.json
      - FEATURE_CONFIG_PATH=/app/model/training/feature_config.json
      - TRAINING_CONFIG_PATH=/app/model/training/training_config.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
